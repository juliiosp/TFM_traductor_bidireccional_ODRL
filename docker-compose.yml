services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odrl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odrl}
      POSTGRES_DB: ${POSTGRES_DB:-odrl}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-odrl} -d ${POSTGRES_DB:-odrl}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-30}
      MAX_REPAIR_ATTEMPTS: ${MAX_REPAIR_ATTEMPTS:-3}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-odrl}:${POSTGRES_PASSWORD:-odrl}@db:5432/${POSTGRES_DB:-odrl}
      API_CORS_ORIGINS: http://localhost:7860
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      API_REQUEST_TIMEOUT: ${API_REQUEST_TIMEOUT:-300}
      API_EVALUATION_TIMEOUT: ${API_EVALUATION_TIMEOUT:-3600}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
      GRADIO_ANALYTICS_ENABLED: "False"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "7860:7860"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/')",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata: