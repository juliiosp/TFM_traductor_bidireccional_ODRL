name: CI and container image publishing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: odrl-production
  cancel-in-progress: true

env:
  API_IMAGE_NAME: odrl-translator-api
  UI_IMAGE_NAME: odrl-translator-ui

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source files
        run: python -m compileall -q app tests

      - name: Run tests
        env:
          DATABASE_URL: sqlite:////tmp/odrl_actions_test.db
        run: pytest -q

  build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: odrl-translator-api:test
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ui
          push: false
          tags: odrl-translator-ui:test
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  publish:
    name: Publish images to GHCR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/${OWNER}/${API_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "ui=ghcr.io/${OWNER}/${UI_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.images.outputs.api }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.api }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.images.outputs.ui }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.ui }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui