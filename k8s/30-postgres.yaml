apiVersion: v1
kind: Service
metadata:
  name: odrl-postgres
  namespace: odrl
  labels:
    app.kubernetes.io/name: odrl-postgres
    app.kubernetes.io/part-of: odrl-translator
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: odrl-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: odrl-postgres
  namespace: odrl
  labels:
    app.kubernetes.io/name: odrl-postgres
    app.kubernetes.io/part-of: odrl-translator
spec:
  serviceName: odrl-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: odrl-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odrl-postgres
        app.kubernetes.io/part-of: odrl-translator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: odrl-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi