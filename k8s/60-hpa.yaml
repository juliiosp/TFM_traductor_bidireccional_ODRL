apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: odrl-api
  namespace: odrl
  labels:
    app.kubernetes.io/name: odrl-api
    app.kubernetes.io/part-of: odrl-translator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: odrl-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60