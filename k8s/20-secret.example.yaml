apiVersion: v1
kind: Secret
metadata:
  name: odrl-api-secrets
  namespace: odrl
type: Opaque
stringData:
  OPENAI_API_KEY: "replace_me"
  DATABASE_URL: "postgresql+psycopg2://odrl:replace_me@odrl-postgres:5432/odrl"
---
apiVersion: v1
kind: Secret
metadata:
  name: odrl-postgres-secret
  namespace: odrl
type: Opaque
stringData:
  POSTGRES_USER: "odrl"
  POSTGRES_PASSWORD: "replace_me"
  POSTGRES_DB: "odrl"